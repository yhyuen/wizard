# Every PR and push to main: the spec check, unit checks, the town's story checks, a bot walking
# the route through the town, the fights in place, magic meeting the world, a web build and the
# desktop builds for Windows, macOS and Linux (each uploaded as an artifact). Pushes to main also
# publish the web build to GitHub Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT: ${{ github.workspace }}/.godot-bin/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the spec check compares the branch with origin/main

      - name: Spec check (a behaviour change updates its spec, docs/systems/)
        run: python3 tools/ci/spec_check.py

      - name: Cache Godot and the web template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web-desktop

      - name: Download Godot and the export templates (web and desktop)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p .godot-bin
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$GODOT"
          chmod +x "$GODOT"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -j -q templates.tpz templates/web_nothreads_release.zip templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/macos.zip templates/version.txt -d "$dest"
          rm godot.zip templates.tpz

      - name: Import
        run: timeout 600 "$GODOT" --headless --path . --import

      - name: Unit checks
        run: tools/ci/godot.sh --script res://tools/tests/unit.gd

      - name: Story checks (every map's people, items, spots and exits)
        run: tools/ci/godot.sh --script res://tools/tests/story_lint.gd

      - name: Walking the route (the camp, down to the halls and back, the shrine, loop 2)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/route.gd

      - name: Relearning (loop 3 is back to loop 1's wells and Practice by day 3)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/relearn.gd

      - name: Every death teaches
        run: tools/ci/godot.sh --script res://tools/tests/deaths.gd

      - name: Calamities (signs, the Eve, the Peak, the Dawn tally, Ring 1's end card)
        run: tools/ci/godot.sh --script res://tools/tests/calamity.gd

      - name: People (bonds and rumours)
        run: tools/ci/godot.sh --script res://tools/tests/people.gd

      - name: Fights in place (fresh and strong)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/encounters.gd

      - name: Magic meets the world (fire, water, force, lightning, Rewind, lamplight, people)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/world_magic.gd

      - name: Map previews
        run: tools/ci/godot.sh --script res://tools/map_preview.gd -- --out "$PWD/map-preview"

      - uses: actions/upload-artifact@v4
        with:
          name: map-preview
          path: map-preview

      - name: Draw budgets (every review screenshot within 150 draw calls and 4 lights)
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq xvfb)
          mkdir -p review-shots
          timeout 1200 xvfb-run -a -s "-screen 0 1440x810x24" "$GODOT" --path . --rendering-driver opengl3 \
            --resolution 1440x810 --fixed-fps 60 --script res://tools/world_shot.gd -- --out "$PWD/review-shots" --check \
            2>&1 | tee shots.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -qE "SCRIPT ERROR|Parse Error" shots.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-shots
          path: review-shots
          retention-days: 14

      - name: Web export
        run: |
          printf 'extends RefCounted\n## Written by CI before the web export.\nconst ID := "%s %s"\n' "${GITHUB_SHA::7}" "$(date -u +%F)" > scripts/game/build_id.gd
          mkdir -p export/web
          "$GODOT" --headless --path . --export-release "Web" export/web/index.html
          test -s export/web/index.wasm
          # The story is plain text, not a resource: make sure the export filter packed every file
          # of it (each one's first scene is in the pack).
          for f in $(find data -name '*.story'); do
            scene=$(grep -m1 '^=== ' "$f")
            grep -qF "$scene" export/web/index.pck || { echo "not packed: $f ($scene)"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wizard-web
          path: export/web

      - name: Desktop exports (Windows, macOS, Linux)
        run: |
          mkdir -p export/windows export/macos export/linux
          "$GODOT" --headless --path . --export-release "Linux" export/linux/wizard.x86_64
          "$GODOT" --headless --path . --export-release "Windows" export/windows/Wizard.exe
          "$GODOT" --headless --path . --export-release "macOS" export/macos/Wizard.zip
          test -s export/windows/Wizard.exe
          unzip -l export/macos/Wizard.zip | grep -q "Contents/MacOS/"
          grep -qF "=== wall_gap" export/linux/wizard.x86_64
          # the Linux build starts and quits cleanly
          timeout 120 export/linux/wizard.x86_64 --headless --quit-after 120

      - uses: actions/upload-artifact@v4
        with:
          name: wizard-windows
          path: export/windows
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: wizard-macos
          path: export/macos
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: wizard-linux
          path: export/linux
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: export/web

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
