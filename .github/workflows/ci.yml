# Every PR and push to main: unit checks, the slice's story checks and route, the slice's fights,
# a bot playthrough of the old Mill fight, and a web build
# (uploaded as an artifact). Pushes to main also publish the web build to GitHub Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT: ${{ github.workspace }}/.godot-bin/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web

      - name: Download Godot and the web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p .godot-bin
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$GODOT"
          chmod +x "$GODOT"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -j -q templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dest"
          rm godot.zip templates.tpz

      - name: Import
        run: timeout 600 "$GODOT" --headless --path . --import

      - name: Unit checks
        run: tools/ci/godot.sh --script res://tools/tests/unit.gd

      - name: Story checks (slice)
        run: tools/ci/godot.sh --script res://tools/tests/story_lint.gd

      - name: Route through the slice (loop 1 to the north door, loop 2 to the end)
        run: tools/ci/godot.sh --script res://tools/tests/route.gd

      - name: Relearning (loop 3 regains the 3rd Ring by day 3)
        run: tools/ci/godot.sh --script res://tools/tests/relearn.gd

      - name: Slice fights (fresh and strong, and the millrace)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/encounters.gd

      - name: Bot playthrough (three loops)
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/fight.gd -- --loops 3 --seconds 240

      - name: Test scenes
        run: tools/ci/godot.sh --fixed-fps 60 --script res://tools/tests/scenes.gd

      - name: Web export
        run: |
          mkdir -p export/web
          "$GODOT" --headless --path . --export-release "Web" export/web/index.html
          test -s export/web/index.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wizard-web
          path: export/web

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: export/web

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
